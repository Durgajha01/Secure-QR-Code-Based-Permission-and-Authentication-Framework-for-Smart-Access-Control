<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin — Hostel Gate</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
  <h1>🗂️ Admin Dashboard</h1>
  <div>
    <span class="who" id="whoami"></span>
    <button class="logout" onclick="logout()">Log out</button>
  </div>
</header>

<main>
  <div class="card">
    <h2>Notifications</h2>
    <div id="notifBox"><div class="empty">Loading…</div></div>
  </div>

  <div class="card">
    <h2>Pattern Analysis</h2>
    <label>Student</label>
    <select id="studentSelect"></select>
    <div id="profileBox" style="margin-top:14px;"></div>
  </div>

  <div class="card">
    <h2>All Requests</h2>
    <div id="allTable"><div class="empty">Loading…</div></div>
  </div>

  <div class="card">
    <h2>Gate Scan Log</h2>
    <div id="scanTable"><div class="empty">Loading…</div></div>
  </div>

  <div class="card">
    <h2>Audit Log</h2>
    <div id="auditTable"><div class="empty">Loading…</div></div>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
